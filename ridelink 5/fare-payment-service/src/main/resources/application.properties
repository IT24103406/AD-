spring.application.name=fare-payment-service

server.port=8084

spring.config.import=optional:file:.env[.properties]

# Spring Cloud OpenFeign
spring.cloud.compatibility-verifier.enabled=false

# Spring Data MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ridelink_fare_payment_db}

# JWT Configuration - secret must be provided via environment variable
jwt.secret=${JWT_SECRET}

# Ride Management Service URL
services.ride-service.base-url=${RIDE_SERVICE_URL:http://localhost:8083}

# Account Service URL
services.account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

# Fare Calculation Rules (configurable via environment variables)
fare.base-fare=${FARE_BASE_FARE:150.00}
fare.per-km-rate=${FARE_PER_KM_RATE:80.00}
fare.per-minute-rate=${FARE_PER_MINUTE_RATE:5.00}
fare.minimum-fare=${FARE_MINIMUM_FARE:250.00}

# Springdoc / Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.ridelink=INFO
