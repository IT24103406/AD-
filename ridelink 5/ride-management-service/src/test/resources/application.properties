spring.application.name=ride-management-service
server.port=8083

# Use in-memory / test config for unit tests (no real MongoDB needed)
spring.data.mongodb.uri=mongodb://localhost:27017/ridelink_ride_management_db_test

# Test JWT secret - not a real secret
jwt.secret=test_secret_key_for_unit_tests_only_not_real

# Driver Service URL (mocked in tests)
services.driver-service.base-url=http://localhost:8082

# Fare Payment Service URL (mocked in tests)
services.fare-payment-service.base-url=http://localhost:8084

# Account Service URL (mocked in tests)
services.account-service.base-url=http://localhost:8081

# Spring Cloud OpenFeign
spring.cloud.compatibility-verifier.enabled=false
