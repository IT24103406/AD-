spring.application.name=driver-vehicle-service
server.port=8082

spring.config.import=optional:file:.env[.properties]

# Spring Cloud OpenFeign
spring.cloud.compatibility-verifier.enabled=false

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ridelink_driver_vehicle_db}

# JWT Secret
jwt.secret=${JWT_SECRET}

# Account Service URL
services.account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

# Swagger/OpenAPI UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
